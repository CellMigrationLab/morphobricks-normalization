name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff format --check .
      # The code standards (design v0.4 §9) and Ruff's findings, against their shrink-only
      # baseline (Ruff's own findings of v0.3.3 are in it, so plain `ruff check .` is not run).
      - run: python tools/check.py --rules

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  # StarDist's normalization, compared bit for bit (tests/test_rgb.py). CSBDeep is
  # installed only here; it is never a dependency of the library.
  csbdeep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" csbdeep
      - run: python -m pytest tests/test_rgb.py -rs
